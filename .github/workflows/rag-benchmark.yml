name: RAG Benchmark

# 触发：PR + push 到 main + 手动
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 不需要的并发取消
concurrency:
  group: rag-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # PR 评论所需
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest sentence-transformers faiss-cpu rank-bm25 numpy tiktoken pdfplumber

      # 准备 PDF fixtures：从 git tracked 的 pdfs.zip 解压（25MB 进 git）
      - name: Prepare PDF fixtures
        run: |
          mkdir -p tests/fixtures/pdfs
          if [ -f tests/fixtures/pdfs/pdfs.zip ]; then
            unzip -o -q tests/fixtures/pdfs/pdfs.zip -d tests/fixtures/pdfs/
            echo "Loaded $(ls tests/fixtures/pdfs/*.pdf | wc -l) PDF fixtures from zip"
          else
            echo "::warning::No pdfs.zip found. Benchmark will use empty corpus (Recall will be 0)."
          fi

      - name: Run RAG benchmark (hash baseline)
        run: |
          HARNESS_RAG_PREFER=hash python tests/benchmarks/benchmark_embedder.py

      - name: Run RAG benchmark (bge-small-zh + noop rerank)
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: 120
          TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface
        run: |
          HARNESS_RAG_PREFER=sentence_transformer \
          HARNESS_RAG_MODEL=BAAI/bge-small-zh-v1.5 \
          HARNESS_RAG_RERANK=noop \
          python tests/benchmarks/benchmark_rerank.py

      # bge-base-zh 暂时从 CI 移除（首次 400MB 下载 + 100 query embed
      # 在 ubuntu-latest runner 上不稳定，且本机网络受限无法预热）
      # 改在本地跑，结果 commit 到 tests/benchmarks/results/
      # 校准阈值用本地实测数字
      # TODO: 网络稳定后加回来
      # - name: Pre-download bge-base-zh (400MB) — download only
      #   ...
      # - name: Run RAG benchmark (bge-base-zh)
      #   ...

      - name: Run unit tests (RAG subset)
        timeout-minutes: 8
        env:
          HARNESS_RAG_PREFER: hash
        run: |
          python -m pytest tests/test_rag_chunker.py \
                          tests/test_rag_embedder.py \
                          tests/test_rag_index.py \
                          tests/test_rag_store.py \
                          tests/test_rag_retriever.py \
                          tests/test_rag_bm25.py \
                          tests/test_rag_fusion.py \
                          tests/test_rag_rerank.py \
                          tests/test_rag_math_chunking.py \
                          tests/test_rag_hnsw.py \
                          tests/test_rag_metadata_filter.py \
                          tests/test_rag_manifest_v3.py \
                          tests/test_rag_eval.py \
                          -q --no-header -p no:cacheprovider --timeout=120 -x

      # v6-8：阈值检查 + 生成 markdown 报告
      # v6-9 校准期：--warn-only（首次跑 bge-base 阈值是猜的）
      # 待 CI 跑出真实 bge-base-zh 数据后，调阈值并去掉 --warn-only
      - name: Compare benchmarks against thresholds
        if: always()
        run: |
          python tests/benchmarks/compare_benchmarks.py --output benchmark_report.md --warn-only

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-benchmark-report
          path: benchmark_report.md
          retention-days: 90

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-benchmark-results
          path: tests/benchmarks/results/
          retention-days: 30

      # v6-8：PR 评论（只在 PR 触发时；push main 不评论）
      - name: Comment PR with benchmark results
        if: github.event_name == 'pull_request' && always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ${{ github.workflow }} run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            ${{ steps.compare.outputs.markdown || '' }}
          # comment 标识（更新而非新建）
          edit-mode: replace

      # v6-8：阈值失败时 job 失败（PR 阻塞）
      - name: Fail job if threshold check failed
        if: failure() && steps.compare.outcome == 'failure'
        run: |
          echo "::error::RAG benchmark below threshold. See benchmark_report.md artifact."
          exit 1
